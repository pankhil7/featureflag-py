version: "3.9"

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: featureflag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/featureflag"
      REDIS_URL: "redis://redis:6379/0"
      PORT: "8080"
      API_KEY: "${API_KEY:-sk_dev}"
      RATE_LIMIT_CAPACITY: "${RATE_LIMIT_CAPACITY:-100}"
      RATE_LIMIT_REFILL_RATE: "${RATE_LIMIT_REFILL_RATE:-10}"
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  redis_data:
